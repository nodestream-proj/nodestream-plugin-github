name: CI Workflow
permissions:
  pull-requests: write

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Install poetry
        run: pipx install poetry
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: 'poetry'
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install --upgrade setuptools
          poetry env use "3.13"
          poetry install
      - name: Run black
        run: poetry run black nodestream_github tests --check --diff
      - name: Run Lint
        run: poetry run ruff check nodestream_github tests --output-format github
      - name: Run ty
        run: poetry run ty check nodestream_github --output-format github
      - name: Run Tests
        run: |
          poetry run pytest --cov-report=html --junitxml=pytest.xml --cov-report=term-missing:skip-covered --cov=nodestream_github tests/ | tee pytest-coverage.txt
      - uses: actions/upload-artifact@v6
        with:
          name: coverage-info
          path: htmlcov/
      - name: Pytest coverage comment
        id: coverageComment
        uses: MishaKav/pytest-coverage-comment@v1
        with:
          pytest-coverage-path: ./pytest-coverage.txt
          junitxml-path: ./pytest.xml
      - name: fail on test errors
        if: ${{ steps.coverageComment.outputs.errors > 0 || steps.coverageComment.outputs.failures > 0 }}
        uses: actions/github-script@v9
        with:
          script: |
              core.setFailed('Pytest Failures or Errors')
